name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    name: Go service
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: umc_auth
          POSTGRES_USER: umc_auth
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umc_auth -d umc_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: "host=127.0.0.1 port=5432 user=umc_auth dbname=umc_auth sslmode=disable"
      PGPASSWORD: testpassword
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build container image
        run: docker build -t umc-auth:ci .
      - name: Export image
        run: |
          docker save umc-auth:ci | gzip -9 > umc-auth-image.tar.gz
          sha256sum umc-auth-image.tar.gz > umc-auth-image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: umc-auth-image
          path: |
            umc-auth-image.tar.gz
            umc-auth-image.tar.gz.sha256
          retention-days: 7

  web:
    name: Vue panel
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
