{{define "content"}}<h1>Audit log</h1>
<div class="panel">
{{if .Audit}}
<table>
<thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead>
<tbody>{{range .Audit}}<tr><td>{{unix .CreatedAt}}</td><td>{{.Actor}}</td><td>{{.Action}}</td><td>{{.Detail}}</td></tr>{{end}}</tbody>
</table>
{{else}}<p class="muted">No audit entries yet.</p>{{end}}
</div>
<p><a href="/admin">Back to admin</a></p>{{end}}
