{{define "content"}}<h1>Sign in</h1>
<p>Use your account to inspect your UUID and authentication endpoint.</p>
{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
<form method="post" action="/login" class="panel">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="username">Username</label>
<input id="username" name="username" value="{{.UsernameInput}}" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
<p class="muted">No account yet? <a href="/register">Register</a>.</p>{{end}}
