user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    # Skin and cape uploads allow a 1 MB file plus multipart overhead.
    client_max_body_size 3m;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    # Edge protection in addition to the application's own in-process limits.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_api:10m rate=30r/s;
    limit_req_status 429;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;

    include /etc/nginx/conf.d/*.conf;
}
