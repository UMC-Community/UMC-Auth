name: umc-auth

# Deployment environment for UMC Auth.
#
# Public entrypoint: Nginx on 80/443.
# Internal only: auth-api:8080 and PostgreSQL.
# The mail service is added in phase 3; see README.md for the DNS and port
# requirements before publishing SMTP/IMAP.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umc_auth
      POSTGRES_USER: umc_auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umc_auth -d umc_auth"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  auth-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: umc-auth:local
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${AUTH_DOMAIN:?Set AUTH_DOMAIN in .env}
      SERVER_NAME: ${SERVER_NAME:-UMC Auth}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-off}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-none}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-16}
      REGISTER_LIMIT_PER_HOUR: ${REGISTER_LIMIT_PER_HOUR:-3}
      REGISTER_LIMIT_PER_DAY: ${REGISTER_LIMIT_PER_DAY:-10}
      REGISTER_LIMIT_GLOBAL_PER_HOUR: ${REGISTER_LIMIT_GLOBAL_PER_HOUR:-100}
      LOGIN_LIMIT_PER_MINUTE: ${LOGIN_LIMIT_PER_MINUTE:-10}
      POW_CHALLENGE_LIMIT_PER_MINUTE: ${POW_CHALLENGE_LIMIT_PER_MINUTE:-30}
      PROFILE_LOOKUP_LIMIT_PER_MINUTE: ${PROFILE_LOOKUP_LIMIT_PER_MINUTE:-60}
      FORGOT_LIMIT_PER_MINUTE: ${FORGOT_LIMIT_PER_MINUTE:-5}
      VERIFY_LIMIT_PER_MINUTE: ${VERIFY_LIMIT_PER_MINUTE:-10}
      REFRESH_LIMIT_PER_MINUTE: ${REFRESH_LIMIT_PER_MINUTE:-60}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      TOKEN_DAYS: ${TOKEN_DAYS:-30}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      COOKIE_SECURE: "true"
      ALLOW_INSECURE_HTTP: "false"
      TRUST_PROXY_HEADERS: "true"
      DATABASE_URL: "host=db port=5432 user=umc_auth dbname=umc_auth sslmode=disable"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BIND_ADDR: "0.0.0.0:8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - edge
      - internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - auth-uploads:/data
    tmpfs:
      - /tmp

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      auth-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN in .env}
      ACCOUNT_DOMAIN: ${ACCOUNT_DOMAIN:?Set ACCOUNT_DOMAIN in .env}
      # Only these two variables are substituted into the Nginx template, so
      # Nginx runtime variables such as $host and $remote_addr stay untouched.
      NGINX_ENVSUBST_FILTER: "AUTH_DOMAIN|ACCOUNT_DOMAIN"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - ./acme:/var/www/certbot:ro
      - ../web/dist:/usr/share/nginx/html/account:ro
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # Optional self-hosted mail server. Enable it with:
  #   docker compose --profile mail up -d
  # First-run provisioning is handled by scripts/provision-mail.sh.
  mail:
    image: stalwartlabs/stalwart:v1
    profiles: ["mail"]
    init: true
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:-mail.example.com}
    environment:
      # Used only for first-run provisioning. provision-mail.sh recreates the
      # container without it after the administrator account is created.
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-}
    ports:
      - "25:25"
      - "465:465"
      - "993:993"
      - "4190:4190"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:443"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
      - ./certs:/etc/stalwart/certs:ro
      - ./mail:/work
    networks:
      edge:
      internal:
        aliases:
          - ${MAIL_HOSTNAME:-mail.example.com}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true

  # One-off helpers for scripts/provision-mail.sh. Not started by "up".
  mail-cli:
    image: ghcr.io/stalwartlabs/cli:latest
    profiles: ["mail-tools"]
    user: "0:0"
    networks:
      - internal
    environment:
      STALWART_URL: http://mail:8080
      NO_COLOR: "1"
    volumes:
      - ./mail:/work
      - ./certs:/certs:ro

networks:
  edge:
  internal:
    internal: true

volumes:
  auth-db:
  auth-uploads:
  stalwart-etc:
  stalwart-data:
