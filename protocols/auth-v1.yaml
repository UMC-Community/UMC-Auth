openapi: 3.1.0
info:
  title: UMC Auth API
  version: "1.0.0"
  description: >
    Account API for UMC Auth. Yggdrasil-compatible Minecraft authentication remains under
    /api/yggdrasil and is not part of this document.
servers:
  - url: https://auth.example.com/api/v1
    description: Auth host
  - url: https://account.example.com/api/v1
    description: Account panel, proxied to the same service
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Accounts
  - name: Profiles
  - name: Admin
paths:
  /meta:
    get:
      tags: [Auth]
      summary: Public server metadata for the account panel
      security: []
      responses:
        "200":
          description: Server configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "202":
          description: Account created; email verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequiredResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify an email code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                client:
                  type: string
                  enum: [api, web, cli, launcher]
                  default: api
      responses:
        "200":
          description: Email verified and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/verify-email/resend:
    post:
      tags: [Auth]
      summary: Resend the verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted; response is the same whether the address exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with a username or email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                  description: Username or email address
                password:
                  type: string
                client:
                  type: string
                  enum: [api, web, cli, launcher]
                  default: api
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Omit when using the umc_auth_refresh cookie
                client:
                  type: string
                  enum: [api, web, cli, launcher]
      responses:
        "200":
          description: New access token and rotated refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "204":
          description: Session revoked
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request a password reset code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted; response is the same whether the address exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset the password with an email code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "204":
          description: Password updated and sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /users/me:
    get:
      tags: [Accounts]
      summary: Current account and session
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  session:
                    $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/sessions:
    get:
      tags: [Accounts]
      summary: List active sessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/sessions/{id}:
    delete:
      tags: [Accounts]
      summary: Revoke a session by public id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session revoked
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profiles/{uuid}:
    get:
      tags: [Profiles]
      summary: Profile by UUID
      security: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /profiles/by-username/{name}:
    get:
      tags: [Profiles]
      summary: Profile by player name
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /users/me/minecraft:
    get:
      tags: [Accounts]
      summary: Current Minecraft profile
      responses:
        "200":
          description: Minecraft profile
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/MinecraftProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/skin:
    post:
      tags: [Accounts]
      summary: Upload or replace the current skin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 64x64 or 64x32 PNG, at most 1 MB
                model:
                  type: string
                  enum: [classic, slim]
                  default: classic
      responses:
        "200":
          description: Updated Minecraft profile
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/MinecraftProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Accounts]
      summary: Remove the current skin
      responses:
        "200":
          description: Updated Minecraft profile
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/MinecraftProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/cape:
    post:
      tags: [Accounts]
      summary: Upload or replace the current cape
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 64x32 or 64x64 PNG, at most 1 MB
      responses:
        "200":
          description: Updated Minecraft profile
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/MinecraftProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Accounts]
      summary: Remove the current cape
      responses:
        "200":
          description: Updated Minecraft profile
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/MinecraftProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/users:
    get:
      tags: [Admin]
      summary: Search accounts
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching accounts
          content:
            application/json:
              schema:
                type: object
                required: [users, total, limit, offset]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/users/{uuid}:
    get:
      tags: [Admin]
      summary: Get one account
      parameters:
        - $ref: "#/components/parameters/UserUUID"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{uuid}/status:
    post:
      tags: [Admin]
      summary: Disable or enable an account
      parameters:
        - $ref: "#/components/parameters/UserUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/users/{uuid}/role:
    post:
      tags: [Admin]
      summary: Change an account role
      parameters:
        - $ref: "#/components/parameters/UserUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [user, moderator, admin, superadmin]
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/users/{uuid}/verify-email:
    post:
      tags: [Admin]
      summary: Mark an email verified
      parameters:
        - $ref: "#/components/parameters/UserUUID"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{uuid}/reset-password:
    post:
      tags: [Admin]
      summary: Reset an account password
      parameters:
        - $ref: "#/components/parameters/UserUUID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  description: Omit to generate a password and return it once
      responses:
        "200":
          description: Password updated; generated_password is present only when omitting new_password
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  generated_password:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /admin/audit:
    get:
      tags: [Admin]
      summary: List audit entries
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Case-insensitive match on actor, action, or detail
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
  /admin/mail:
    get:
      tags: [Admin]
      summary: List mail outbox metadata
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, failed, sent]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Mail entries without message bodies
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/MailEntry"
  /admin/mail/{id}/retry:
    post:
      tags: [Admin]
      summary: Retry a mail entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Queued for retry
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/invites:
    get:
      tags: [Admin]
      summary: List invite codes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Invite codes (plaintext codes are never returned)
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
    post:
      tags: [Admin]
      summary: Create a batch of invite codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count, uses, days]
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                uses:
                  type: integer
                  minimum: 1
                  maximum: 100
                days:
                  type: integer
                  minimum: 1
                  maximum: 365
                note:
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: Codes created; plaintext values are returned only here
          content:
            application/json:
              schema:
                type: object
                required: [codes, invites]
                properties:
                  codes:
                    type: array
                    items:
                      type: string
                  invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
  /admin/invites/{id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke an invite code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Invite revoked
        "400":
          $ref: "#/components/responses/BadRequest"
  /admin/servers:
    get:
      tags: [Admin]
      summary: List registered game servers
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Registered servers
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: "#/components/schemas/GameServer"
    post:
      tags: [Admin]
      summary: Register a game server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 64
                address:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server:
                    $ref: "#/components/schemas/GameServer"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/servers/joins:
    get:
      tags: [Admin]
      summary: List recent Yggdrasil join records
      parameters:
        - name: server_id
          in: query
          schema:
            type: string
          description: Filter by the server id sent in the join request
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Join records
          content:
            application/json:
              schema:
                type: object
                required: [joins]
                properties:
                  joins:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinRecord"
  /admin/servers/{id}/status:
    post:
      tags: [Admin]
      summary: Enable or disable a registered server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server:
                    $ref: "#/components/schemas/GameServer"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/servers/{id}:
    delete:
      tags: [Admin]
      summary: Delete a registered server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Server deleted; join history is kept
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/stats:
    get:
      tags: [Admin]
      summary: User and mail counters
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    UserUUID:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role or account-state check failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Username or email already registered
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit reached
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Email delivery is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Meta:
      type: object
      properties:
        server_name:
          type: string
        registration_mode:
          type: string
          enum: [invite, open, closed]
        registration_open:
          type: boolean
        first_account:
          type: boolean
        bootstrap_required:
          type: boolean
        email_verification:
          type: string
          enum: [off, required]
        captcha_mode:
          type: string
          enum: [none, pow, turnstile]
        turnstile_site_key:
          type: string
        auth_origin:
          type: string
          format: uri
        yggdrasil_url:
          type: string
          format: uri
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 16
          pattern: "^[A-Za-z0-9_]+$"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        invite_code:
          type: string
        bootstrap_token:
          type: string
        turnstile_token:
          type: string
        pow_token:
          type: string
        pow_nonce:
          type: string
        client:
          type: string
          enum: [api, web, cli, launcher]
          default: api
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    VerificationRequiredResponse:
      type: object
      properties:
        verification_required:
          type: boolean
        message:
          type: string
        user:
          $ref: "#/components/schemas/User"
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user, session]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Omitted for client=web; the refresh token is set as a cookie
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer
          description: Omitted for client=web
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"
    User:
      type: object
      required: [id, uuid, username, email, email_verified, role, status]
      properties:
        id:
          type: string
        uuid:
          type: string
        username:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        role:
          type: string
          enum: [user, moderator, admin, superadmin]
        status:
          type: string
          enum: [active, pending, disabled, locked]
        created_at:
          type: integer
        updated_at:
          type: integer
    Session:
      type: object
      properties:
        id:
          type: string
        client:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        created_at:
          type: integer
        last_used_at:
          type: integer
        expires_at:
          type: integer
        current:
          type: boolean
    Profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/TextureProperty"
    TextureProperty:
      type: object
      required: [name, value, signature]
      properties:
        name:
          type: string
          const: textures
        value:
          type: string
          description: Base64-encoded JSON textures payload
        signature:
          type: string
          description: Base64 RSA PKCS#1 v1.5 SHA-256 signature over value
    MinecraftProfile:
      type: object
      properties:
        uuid:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
        skin_url:
          type: string
          description: Empty when no skin is set
        cape_url:
          type: string
          description: Empty when no cape is set
        skin_model:
          type: string
          enum: [classic, slim]
        updated_at:
          type: integer
    Invite:
      type: object
      properties:
        id:
          type: integer
        code_prefix:
          type: string
        note:
          type: string
        max_uses:
          type: integer
        used_count:
          type: integer
        expires_at:
          type: integer
        revoked_at:
          type: integer
          nullable: true
        created_at:
          type: integer
        status:
          type: string
          enum: [active, expired, exhausted, revoked]
    GameServer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_by:
          type: integer
          nullable: true
        created_at:
          type: integer
        updated_at:
          type: integer
    JoinRecord:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        server_id:
          type: string
        username:
          type: string
        ip:
          type: string
        created_at:
          type: integer
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        actor:
          type: string
        action:
          type: string
        detail:
          type: string
        created_at:
          type: integer
    MailEntry:
      type: object
      properties:
        id:
          type: integer
        recipient:
          type: string
        subject:
          type: string
        kind:
          type: string
        status:
          type: string
        attempts:
          type: integer
        last_error:
          type: string
        next_attempt_at:
          type: integer
        created_at:
          type: integer
        sent_at:
          type: integer
          nullable: true
    Stats:
      type: object
      properties:
        users:
          type: integer
        active_users:
          type: integer
        pending_users:
          type: integer
        disabled_users:
          type: integer
        pending_mail:
          type: integer
